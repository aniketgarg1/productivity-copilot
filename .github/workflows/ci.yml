name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests never reach a real service; these exist so settings can load.
  SESSION_SECRET: ci-secret-not-a-real-one
  OPENAI_API_KEY: sk-ci-not-a-real-key
  GOOGLE_CLIENT_ID: ci-client-id
  GOOGLE_CLIENT_SECRET: ci-client-secret
  DAILY_CHECKIN_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pyflakes

      - name: Lint
        run: python -m pyflakes app/ tests/ scripts/

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: copilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/copilot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrations apply to a clean database
        run: python scripts/migrate.py

      - name: Migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Models match the migrations
        # Fails if someone changed a model without generating a migration.
        run: alembic check

      - name: An old pre-Alembic database is adopted, not clobbered
        # Simulates a database from the create_all() era: baseline tables, no
        # alembic_version, and none of the columns later migrations add.
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db.session import engine
          with engine.begin() as c:
              c.execute(text("DROP TABLE IF EXISTS alembic_version"))
              c.execute(text("ALTER TABLE task_records DROP COLUMN IF EXISTS last_synced_at"))
              c.execute(text(
                  "INSERT INTO user_profiles (email, daily_checkin_enabled, "
                  "preferred_checkin_hour, timezone) "
                  "VALUES ('legacy@example.com', true, 9, 'UTC')"
              ))
          PY
          python scripts/migrate.py
          python - <<'PY'
          from sqlalchemy import text
          from app.db.session import engine
          with engine.connect() as c:
              survived = c.execute(text(
                  "SELECT count(*) FROM user_profiles WHERE email = 'legacy@example.com'"
              )).scalar()
              column = c.execute(text(
                  "SELECT count(*) FROM information_schema.columns "
                  "WHERE table_name='task_records' AND column_name='last_synced_at'"
              )).scalar()
          assert survived == 1, "pre-Alembic data was lost during adoption"
          assert column == 1, "outstanding migration was not applied after adoption"
          print("old schema adopted, data kept, migration applied")
          PY

      - name: An unstamped but already-current database is adopted
        # A database whose tables are current but which has no Alembic history:
        # stamping the baseline here would replay migrations that add columns
        # it already has.
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db.session import engine
          with engine.begin() as c:
              c.execute(text("DROP TABLE IF EXISTS alembic_version"))
          PY
          python scripts/migrate.py
          python - <<'PY'
          from sqlalchemy import text
          from app.db.session import engine
          with engine.connect() as c:
              version = c.execute(text("SELECT version_num FROM alembic_version")).scalar()
          assert version, "database was not stamped"
          print("current-but-unstamped schema adopted at", version)
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: productivity-copilot-backend:ci

      - name: The image starts and serves /health
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_DB=copilot -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres:16
          for i in $(seq 1 30); do
            docker exec ci-db pg_isready -U postgres && break
            sleep 2
          done
          docker run -d --name ci-api --network ci-net -p 8000:8000 \
            -e DATABASE_URL=postgresql://postgres:postgres@ci-db:5432/copilot \
            -e SESSION_SECRET=ci-secret -e DAILY_CHECKIN_ENABLED=false \
            productivity-copilot-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          echo "container is serving traffic"

      - name: Container runs as a non-root user
        run: |
          test "$(docker exec ci-api id -u)" != "0"
          echo "uid is $(docker exec ci-api id -u)"

      - name: Show logs on failure
        if: failure()
        run: docker logs ci-api || true
